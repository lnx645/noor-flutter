name: CI (analisis + uji + APK debug)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Analyze, test & APK debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instal dependensi
        run: flutter pub get

      - name: Analisis statis
        run: flutter analyze

      - name: Uji unit
        run: flutter test

      - name: Rakit APK debug
        run: flutter build apk --debug

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: noor-flutter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
