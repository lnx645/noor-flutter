name: Rilis (APK + AAB bertanda tangan ke GitHub Release)

# Build rilis Noor Flutter dengan kunci rilis tetap (secret RELEASE_*,
# keystore yang sama dengan versi Capacitor — kontinuitas Play Store).
# Pemicu: push tag v* atau dispatch manual.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  rilis:
    name: Build & terbitkan rilis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pasang keystore rilis tetap
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > android/app/noor-release.keystore
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=noor-release.keystore
          EOF

      - name: Instal dependensi
        run: flutter pub get

      - name: Analisis + uji
        run: |
          flutter analyze
          flutter test

      - name: Rakit APK + AAB rilis
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Verifikasi tanda tangan rilis
        # Gagal keras bila sertifikat bukan kunci rilis yang ditetapkan.
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          DIGEST=$($APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: //' | tr -d ' ' | tr 'A-F' 'a-f')
          echo "Sertifikat APK rilis: $DIGEST"
          test "$DIGEST" = "29efa67031137eccfd98cdf24c76469dec0e26f6f8ea566cd0b95995d35337c3"

      - name: Siapkan berkas rilis
        run: |
          mkdir -p rilis
          cp build/app/outputs/flutter-apk/app-release.apk rilis/noor.apk
          cp build/app/outputs/bundle/release/app-release.aab rilis/noor.aab
          ls -la rilis

      - name: Unggah sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-flutter-release
          path: rilis/
          if-no-files-found: error

      - name: Terbitkan GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" rilis/noor.apk rilis/noor.aab \
            --title "Noor (Flutter) ${{ github.ref_name }}" \
            --notes "Rilis Noor versi Flutter (native) ${{ github.ref_name }} — Al-Qur'an & Ibadah.

          - **noor.apk** — instal langsung di Android.
          - **noor.aab** — untuk Google Play Console.

          Bertanda tangan kunci rilis yang sama dengan versi sebelumnya (com.noor.app)."
